spring.application.name=veterinaria
server.port=${PORT:8080}

# Datos de conexion: se leen de config/db.properties (no se sube a GitHub)
spring.config.import=optional:file:./config/db.properties
spring.datasource.url=${db.url:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${db.usuario:VETERINARIA}
spring.datasource.password=${db.password:}

spring.thymeleaf.cache=false
server.servlet.session.timeout=8h
server.error.whitelabel.enabled=false
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm

# Muestra en la consola cada SQL que ejecuta la app (util para aprender/depurar)
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.com.vet=INFO
