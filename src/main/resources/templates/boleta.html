<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: pagina(~{::title}, ~{::section})}">
<head><title>Boleta - VetCare</title></head>
<body>
<section>
    <div class="encabezado no-imprimir">
        <div><h1 th:text="${tituloBoleta}">Boleta</h1>
            <div class="sub">Vista lista para imprimir</div></div>
    </div>

    <!-- El texto ya viene armado desde Oracle; th:text lo escapa, asi que no se puede inyectar HTML -->
    <div class="card" style="max-width:620px" th:if="${textoBoleta != null}">
        <div class="card-body p-4">
            <pre class="boleta" th:text="${textoBoleta}"></pre>
        </div>
    </div>
    <div class="alert alert-warning" style="max-width:620px" th:if="${textoBoleta == null}">
        <i class="bi bi-exclamation-triangle me-1"></i>No se encontro el registro solicitado.
    </div>

    <div class="mt-3 d-flex gap-2 no-imprimir">
        <a class="btn btn-outline-secondary" th:href="@{${volver}}"><i class="bi bi-arrow-left me-1"></i>Regresar</a>
        <button type="button" class="btn btn-primary" th:if="${textoBoleta != null}" onclick="window.print()">
            <i class="bi bi-printer me-1"></i>Imprimir</button>
    </div>
</section>
</body>
</html>
